name: MaybeMeibeMaybi/dsh-harmonyos-hiboard
category: notify
description:
  en: 'Pushes DeepSeek Harness task results to Huawei HarmonyOS assistant-today (负一屏) as service cards: a hiboard_push tool that posts a Markdown result with an optional schedule_id for grouping, hiboard_verify for an end-to-end connection test, a settings card that accepts either the authCode or the whole OpenClaw linking command, and a built-in rescue-and-retry safety net that is on by default.'
  zh: '把 DeepSeek Harness 的任务结果以服务卡片推送到华为鸿蒙负一屏：hiboard_push 工具（可用 schedule_id 分组）、hiboard_verify 做端到端连接测试、可直接粘贴整条关联指令的设置卡片，以及默认开启的内置抢救与重试兜底。'
